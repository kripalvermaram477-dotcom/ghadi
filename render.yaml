databases:
  - name: ghadi-db
    databaseName: ghadi
    user: ghadi
    plan: free

services:
  - type: web
    name: ghadi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/common/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ghadi-db
          property: connectionString
      - key: USER_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        value: "9999999999"
      - key: ADMIN_PASSWORD
        sync: false
