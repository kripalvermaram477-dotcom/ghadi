<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Noto Sans Devanagari','Mangal',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="0.45" stop-color="#29a8e8"/>
      <stop offset="1" stop-color="#0b6fb8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1976d2"/>
      <stop offset="0.45" stop-color="#0d47a1"/>
      <stop offset="1" stop-color="#062a66"/>
    </linearGradient>
    <linearGradient id="pouchShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3e5fc"/>
      <stop offset="1" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d32f2f"/>
      <stop offset="1" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- sunbeams -->
  <g opacity="0.35">
    <ellipse cx="980" cy="120" rx="340" ry="340" fill="url(#sun)"/>
    <polygon points="980,120 1200,0 1200,120" fill="#ffffff" opacity="0.5"/>
    <polygon points="980,120 1200,220 1200,300" fill="#ffffff" opacity="0.35"/>
    <polygon points="980,120 850,0 980,0" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- detergent pouch -->
  <g transform="rotate(-3 340 400)">
    <rect x="110" y="55" width="450" height="675" rx="16" fill="url(#pouch)"/>
    <rect x="110" y="55" width="450" height="675" rx="16" fill="url(#pouchShine)"/>
    <!-- top seal -->
    <rect x="110" y="55" width="450" height="26" rx="8" fill="#0b3d91"/>
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
      <line x1="120" y1="68" x2="550" y2="68"/>
    </g>
    <!-- yellow banner -->
    <path d="M110 95 Q335 60 560 95 L560 175 Q335 145 110 175 Z" fill="#ffd400"/>
    <text x="335" y="130" font-size="34" font-weight="700" fill="#d32f2f" text-anchor="middle">सुपर</text>
    <text x="335" y="168" font-size="38" font-weight="700" fill="#0d47a1" text-anchor="middle">सफाई</text>
    <path d="M195 180 Q335 165 485 180" stroke="#d32f2f" stroke-width="5" fill="none"/>

    <!-- sunburst -->
    <circle cx="335" cy="320" r="150" fill="#ffffff" opacity="0.18"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="4">
      <line x1="335" y1="170" x2="335" y2="200"/>
      <line x1="230" y1="215" x2="252" y2="238"/>
      <line x1="440" y1="215" x2="418" y2="238"/>
      <line x1="190" y1="320" x2="222" y2="320"/>
      <line x1="480" y1="320" x2="448" y2="320"/>
    </g>

    <!-- clock dial -->
    <circle cx="335" cy="320" r="105" fill="#ffd400" stroke="#ffffff" stroke-width="8"/>
    <circle cx="335" cy="320" r="88" fill="none" stroke="#e65100" stroke-width="3"/>
    <g stroke="#d32f2f" stroke-width="7" stroke-linecap="round">
      <line x1="335" y1="235" x2="335" y2="250"/>
      <line x1="335" y1="390" x2="335" y2="405"/>
      <line x1="250" y1="320" x2="265" y2="320"/>
      <line x1="405" y1="320" x2="420" y2="320"/>
      <line x1="275" y1="260" x2="286" y2="271"/>
      <line x1="395" y1="260" x2="384" y2="271"/>
      <line x1="275" y1="380" x2="286" y2="369"/>
      <line x1="395" y1="380" x2="384" y2="369"/>
    </g>
    <line x1="335" y1="320" x2="390" y2="270" stroke="#d32f2f" stroke-width="10" stroke-linecap="round"/>
    <circle cx="335" cy="320" r="12" fill="#d32f2f"/>

    <!-- घड़ी -->
    <text x="335" y="455" font-size="132" font-weight="900" fill="#d32f2f" stroke="#ffd400" stroke-width="14" paint-order="stroke" text-anchor="middle">घड़ी</text>
    <text x="500" y="390" font-size="22" font-weight="700" fill="#1565c0">®</text>
    <!-- detergent powder -->
    <text x="335" y="515" font-size="40" font-weight="800" fill="#0d47a1" stroke="#ffffff" stroke-width="7" paint-order="stroke" text-anchor="middle">डिटर्जेंट पाउडर</text>

    <!-- water splash -->
    <path d="M110 600 Q170 540 240 585 Q300 530 360 590 Q430 525 500 590 Q560 545 560 610 L560 730 L110 730 Z" fill="url(#water)" opacity="0.9"/>
    <path d="M110 640 Q180 590 250 630 Q320 580 390 630 Q470 585 560 640" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.8"/>
    <g fill="#e1f5fe" opacity="0.85">
      <circle cx="160" cy="560" r="12"/>
      <circle cx="205" cy="535" r="8"/>
      <circle cx="470" cy="560" r="10"/>
      <circle cx="520" cy="545" r="7"/>
    </g>
    <!-- white shirt -->
    <g transform="translate(245 610) rotate(-8)">
      <path d="M0 30 L45 0 L90 30 L70 60 L70 130 L20 130 L20 60 Z" fill="#ffffff"/>
      <path d="M45 0 L58 35 L45 48 L32 35 Z" fill="#e3f2fd"/>
      <line x1="45" y1="48" x2="45" y2="120" stroke="#cfd8dc" stroke-width="3"/>
      <circle cx="45" cy="70" r="3" fill="#90a4ae"/>
      <circle cx="45" cy="90" r="3" fill="#90a4ae"/>
    </g>

    <!-- ribbon -->
    <path d="M250 690 Q400 650 560 680 L560 745 Q400 720 250 760 Q230 720 250 690 Z" fill="url(#ribbon)" stroke="#ffd400" stroke-width="6"/>
    <text x="410" y="720" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">चमकदार कपड़े</text>
    <text x="410" y="750" font-size="22" font-weight="700" fill="#ffd400" text-anchor="middle">लंबे समय तक</text>
  </g>

  <!-- right headline -->
  <g transform="rotate(-4 980 240)">
    <text x="980" y="250" font-size="170" font-weight="900" fill="#d32f2f" stroke="#ffd400" stroke-width="22" paint-order="stroke" text-anchor="middle">घड़ी</text>
  </g>
  <text x="900" y="400" font-size="64" font-weight="800" fill="#0d47a1" transform="rotate(-6 900 400)">सफाई भी...</text>
  <text x="900" y="490" font-size="64" font-weight="800" fill="#0d47a1" transform="rotate(-6 900 490)">कमाई भी...</text>
  <path d="M790 540 Q980 500 1140 545" stroke="#d32f2f" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- folded clothes stack bottom right -->
  <g transform="translate(760 560)">
    <rect x="0" y="120" width="300" height="55" rx="10" fill="#4fc3f7"/>
    <rect x="10" y="70" width="280" height="55" rx="10" fill="#f48fb1"/>
    <rect x="20" y="20" width="260" height="55" rx="10" fill="#ffd54f"/>
    <rect x="30" y="-30" width="240" height="55" rx="10" fill="#81d4fa"/>
    <!-- white shirt on top -->
    <g transform="translate(70 -95)">
      <path d="M0 30 L40 0 L80 30 L62 60 L62 100 L18 100 L18 60 Z" fill="#ffffff"/>
      <path d="M40 0 L52 32 L40 44 L28 32 Z" fill="#e3f2fd"/>
      <line x1="40" y1="44" x2="40" y2="95" stroke="#cfd8dc" stroke-width="3"/>
      <circle cx="40" cy="62" r="3" fill="#90a4ae"/>
      <circle cx="40" cy="80" r="3" fill="#90a4ae"/>
    </g>
  </g>

  <!-- washing machine -->
  <g transform="translate(1030 470)" opacity="0.95">
    <rect x="0" y="0" width="150" height="210" rx="14" fill="#f5f5f5" stroke="#cfd8dc" stroke-width="4"/>
    <rect x="12" y="12" width="126" height="40" rx="8" fill="#e0e0e0"/>
    <circle cx="28" cy="32" r="10" fill="#90a4ae"/>
    <rect x="55" y="22" width="60" height="18" rx="4" fill="#b0bec5"/>
    <circle cx="75" cy="130" r="55" fill="#37474f"/>
    <circle cx="75" cy="130" r="45" fill="#4fc3f7" opacity="0.8"/>
    <circle cx="75" cy="130" r="34" fill="#e1f5fe" opacity="0.7"/>
    <path d="M45 120 Q75 95 105 120" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8"/>
  </g>

  <!-- bubbles and sparkles -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="640" cy="120" r="22"/>
    <circle cx="700" cy="200" r="14"/>
    <circle cx="620" cy="300" r="10"/>
    <circle cx="1110" cy="330" r="26"/>
    <circle cx="1160" cy="250" r="12"/>
    <circle cx="60" cy="300" r="18"/>
    <circle cx="40" cy="420" r="12"/>
  </g>
  <g fill="#ffffff">
    <path d="M640 80 L645 92 L657 97 L645 102 L640 114 L635 102 L623 97 L635 92 Z" opacity="0.9"/>
    <path d="M1110 290 L1114 300 L1124 304 L1114 308 L1110 318 L1106 308 L1096 304 L1106 300 Z" opacity="0.9"/>
    <path d="M1140 550 L1144 560 L1154 564 L1144 568 L1140 578 L1136 568 L1126 564 L1136 560 Z" opacity="0.8"/>
  </g>
</svg>